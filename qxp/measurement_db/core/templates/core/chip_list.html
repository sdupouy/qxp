{% extends 'core/base.html' %}

{% block content %}
  <h1>Chips</h1>
  
  <div class="row my-3 py-2">
    {% for chip in object_list %}
    <div class="col-lg-4 col-md-6 mb-3">
      <div class="card clickable-card">
        <div class="card-header">
          <h4 class="mb-0">{{ chip.identifier }}</h4>
        </div>
        {% if chip %}
          <div class="row g-0">
            <div class="col-sm-4 img-container rounded-bottom-left">
              <img src="{{ chip.picture.url }}" alt="chip picture">
            </div>
            <div class="col-sm-8">
              <div class="card-body">
                <div class="card-text mb-2">
                  <small class="text-body-secondary"><i class="bi bi-tools me-2"></i>Fabricated on {{ chip.fab_date }}</small>
                </div>
                <p class="card-text">{{ chip.comment }}</p>
                <a href="{% url 'chip-detail' chip.identifier %}" class="stretched-link"></a>
              </div>
            </div>
          </div>
        {% else %}
          <div class="p-3">
            <p>No chip yet.</p>
          </div>
        {% endif %}
      </div>
    </div>
  {% endfor %}
  </div>
{% endblock %}
