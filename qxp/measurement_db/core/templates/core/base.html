{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>qxp DB</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'core/main.css' %}">

  <link rel="icon" type="image/png" href="{% static 'core/favicon/favicon-96x96.png' %}" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="{% static 'core/favicon/favicon.svg' %}" />
  <link rel="shortcut icon" href="{% static 'core/favicon/favicon.ico' %}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'core/favicon/apple-touch-icon.png' %}" />
  <meta name="apple-mobile-web-app-title" content="qxp" />
  <link rel="manifest" href="{% static 'core/favicon/site.webmanifest' %}" />

  {% block meta %}
  {% endblock %}
</head>
<body>
<nav class="navbar" id="navbar" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'index' %}">
      <img src="{% static 'core/favicon/favicon.svg' %}" alt="Logo" width="34" height="34" id="logo">
      Database web panel
    </a>
    <div id="nav-buttons" class="d-flex">
      {% block navbar_links %}
      {% endblock %}
      <a type="button" class="btn" role="button" href="{% url 'admin:index' %}"><i class="bi bi-pencil-square me-2"></i>Admin panel</a>
      <button class="navbar-toggler ms-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <i class="bi bi-list fs-3"></i>
      </button>
    
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasNavbarLabel">qxp database web panel</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'index' %}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'experiment-list' %}">Experiments</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'chip-list' %}">Chips</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'experiment-run-list' %}">Experiment runs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'measurement-list' %}">Measurements</a>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</nav>

<div class="container py-4">
  {% block content %}
  {% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
{% block scripts %}
{% endblock %}
</body>
</html>
