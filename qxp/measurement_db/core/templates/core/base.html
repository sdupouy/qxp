{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <title>qxp DB</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'core/main.css' %}">

  <link rel="icon" type="image/png" href="{% static 'core/favicon/favicon-96x96.png' %}" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="{% static 'core/favicon/favicon.svg' %}" />
  <link rel="shortcut icon" href="{% static 'core/favicon/favicon.ico' %}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'core/favicon/apple-touch-icon.png' %}" />
  <meta name="apple-mobile-web-app-title" content="qxp" />
  <link rel="manifest" href="{% static 'core/favicon/site.webmanifest' %}" />

  {% block meta %}
  {% endblock %}
</head>
<body>
<nav class="navbar" id="navbar" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'index' %}">
      <img src="{% static 'core/favicon/favicon.svg' %}" alt="Logo" width="34" height="34" id="logo">
      Database webpanel
    </a>
    <div id="nav-buttons" class="d-flex">
      {% block navbar_links %}
      {% endblock %}
      <a type="button" class="btn" role="button" href="{% url 'admin:index' %}"><i class="bi bi-pencil-square me-2"></i>Admin panel</a>
    </div>
  </div>
</nav>

<div class="container py-3">
  {% block content %}
  {% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
