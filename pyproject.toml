[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qxp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django",
    "qm-qua",
    "qualang-tools",
    "numpy",
    "scipy",
    "matplotlib",
    "pyvisa",
    "h5py"
]
authors = [
    {name = "Simon Dupouy", email = "simon.dupouy@gmail.com"},
]
description = "A Quantum Experimentation Platform."
readme = "README.md"
