[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qxp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django",
    "django-crispy-forms",
    "crispy-bootstrap5",
    "qm-qua",
    "qualang-tools",
    "numpy",
    "scipy",
    "matplotlib",
    "pyvisa",
    "h5py",
    "tqdm"
]
authors = [
    {name = "Simon Dupouy", email = "simon.dupouy@gmail.com"},
]
description = "A Quantum Experimentation Platform."
readme = "README.md"

[project.scripts]
qxp-create-project = "qxp.qxp_admin:create_project"
qxp-start-webpanel = "qxp.qxp_admin:start_webpanel"
qxp-backup = "qxp.qxp_admin:backup"

[tool.setuptools]
packages = ["qxp"]

[tool.setuptools.package-data]
qxp = ["project_template/**"]